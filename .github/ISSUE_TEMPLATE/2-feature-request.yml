name: Feature request
description: Suggest an idea for this project
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Before you ask for a new device field or control, [check that the public API provides it](https://github.com/uilibs/uiprotect#check-the-public-api).
  - type: textarea
    id: description
    attributes:
      label: Is your feature request related to a problem? Please describe.
      description: A clear and concise description of what the problem is.
      value: I'm always frustrated when
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Describe alternatives you've considered
      description: A clear and concise description of any alternative solutions or features you've considered.
      placeholder: Describe alternatives you've considered
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add any other context or screenshots about the feature request here.
      placeholder: Additional context
  - type: textarea
    id: public-api-output
    attributes:
      label: Public API output (optional)
      description:
        If you can, paste what the public API returns for the affected
        device, see [Check the public API first](https://github.com/uilibs/uiprotect#check-the-public-api).
        Remove MAC addresses, IP addresses and serial numbers first, and never include your API key.
      render: json
  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      description: By submitting this issue, you agree to follow our
        [Code of Conduct](https://github.com/uilibs/uiprotect/blob/main/.github/CODE_OF_CONDUCT.md).
      options:
        - label: I agree to follow this project's Code of Conduct
          required: true
  - type: markdown
    attributes:
      value: 👋 Have a great day and thank you for the feature request!
